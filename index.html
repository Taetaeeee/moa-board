<div id="moa-board" aria-label="메모에 집중하는 암기 화이트보드">
  <div class="mf-modes" role="group" aria-label="보드 모드">
    <button type="button" id="mf-edit" class="cursor-interaction" aria-pressed="true"><i data-lucide="mouse-pointer-2" aria-hidden="true"></i>편집 모드</button>
    <button type="button" id="mf-study" class="cursor-interaction" aria-pressed="false"><i data-lucide="brain" aria-hidden="true"></i>암기 모드<kbd>M</kbd></button>
  </div>
  <div id="mf-canvas" class="mf-canvas" aria-label="빈 공간을 우클릭해서 메모를 붙이는 보드">
    <div id="mf-world" class="mf-world"></div>
  </div>
  <div id="mf-menu" class="mf-menu" aria-label="메모 메뉴" hidden></div>
  <section id="mf-pages" class="mf-pages" aria-label="페이지별 보기와 전체 보기" hidden>
    <div class="mf-popover-top"><span>페이지 · 보기</span><button type="button" data-action="close-pages" aria-label="페이지 목록 닫기" class="cursor-interaction"><i data-lucide="x" aria-hidden="true"></i></button></div>
    <div id="mf-page-list"></div>
    <form id="mf-page-form"><input id="mf-page-name" aria-label="새 페이지 이름" placeholder="새 페이지 이름" maxlength="30" autocomplete="off"><button type="submit" aria-label="페이지 추가" class="cursor-interaction"><i data-lucide="plus" aria-hidden="true"></i></button></form>
    <div class="mf-file-actions">
      <button type="button" data-action="export-file" class="cursor-interaction"><i data-lucide="download" aria-hidden="true"></i>파일로 저장 <kbd>Ctrl S</kbd></button>
      <button type="button" data-action="import-file" class="cursor-interaction"><i data-lucide="folder-open" aria-hidden="true"></i>파일 불러오기 <kbd>Ctrl O</kbd></button>
    </div>
    <a id="mf-export-link" class="mf-download-link cursor-interaction" hidden>저장 파일 다운로드</a>
    <div id="mf-file-status" class="mf-file-status" role="status" aria-live="polite" hidden></div>
  </section>
  <input id="mf-file-input" type="file" accept=".json,application/json" aria-label="모아보드 저장 파일 선택" hidden>
  <div id="mf-live" class="mf-live" aria-live="polite"></div>
</div>
<style>
  #moa-board {

  #moa-board .mf-note::after {content:"";position:absolute;right:0;bottom:0;width:15px;height:15px;background:var(--mf-fold);clip-path:polygon(100% 0,100% 100%,0 100%);border-radius:0 0 7px 0;pointer-events:none}

  #moa-board .mf-note[data-color=lilac] {background:var(--mf-lilac)}

  #moa-board .mf-note.mf-masked[data-mask=all] .mf-note-title {filter:blur(6px);pointer-events:none}
  #moa-board .mf-note.mf-editing {z-index:5;user-select:text}
  #moa-board .mf-note textarea {display:block;width:100%;min-width:0;resize:vertical;border:0;border-bottom:1px solid var(--mf-fold);border-radius:0;background:transparent;padding:2px 0 6px}
  #moa-board .mf-note textarea::placeholder {color:var(--mf-sub);opacity:.8}
  #moa-board #mf-title-input {font-size:16px;line-height:1.65;min-height:56px;font-weight:500;margin-bottom:12px}
  #moa-board #mf-body-input {font-size:13px;line-height:1.9;min-height:94px}
  #moa-board .mf-editor-actions {display:flex;justify-content:flex-end;gap:6px;margin-top:12px}

  #moa-board .mf-menu,#moa-board .mf-pages {position:absolute;z-index:30;background:var(--mf-panel);border:1px solid var(--mf-line);border-radius:10px;padding:7px;box-shadow:0 7px 25px var(--mf-shadow);width:240px;max-width:calc(100% - 24px)}

  function validateFile(raw){
    const fail=message=>{throw new Error(message);};

    const finite=(v,min,max)=>typeof v==='number'&&Number.isFinite(v)&&v>=min&&v<=max;
    const text=(v,max)=>typeof v==='string'&&v.length<=max;

      if(!record(v)||!finite(v.x,-1000000,1000000)||!finite(v.y,-1000000,1000000)||!finite(v.z,.1,5))fail('보드의 화면 위치 정보가 올바르지 않아요.');

      if(total>5000)fail('한 파일에서는 메모를 5,000개까지 열 수 있어요.');

        if(!record(n)||!id(n.id)||noteIds.has(n.id))fail('메모 식별 정보가 올바르지 않거나 중복되어 있어요.');

        if(!text(n.title,500)||!text(n.body,20000))fail('메모 내용이 올바르지 않아요.');
        if(!finite(n.x,-1000000,1000000)||!finite(n.y,-1000000,1000000))fail('메모 위치가 올바르지 않아요.');
        if(!['yellow','mint','lilac'].includes(n.color)||!Object.hasOwn(topics,n.topic)||!['body','all'].includes(n.mask)||typeof n.hidden!=='boolean')fail('메모 설정이 올바르지 않아요.');

      });

      if(!Array.isArray(state.overviewPositions)||state.overviewPositions.length>5000)fail('전체 보기의 배치 정보가 올바르지 않아요.');

  function remove(){
    if(study||!selected.size)return;
    snapshot();[...selected].forEach(dropNote);selected.clear();closePanels();render();
  }
  function duplicate(){
    if(study||!picked().length)return;
    snapshot();const originals=picked(),mapping=new Map(),copies=originals.map(n=>{
      const copy={...n,id:'copy-'+Date.now()+'-'+serial++,x:n.x+30,y:n.y+30};
      if(n.group){if(!mapping.has(n.group))mapping.set(n.group,'group-'+serial++);copy.group=mapping.get(n.group);}
      ownerOf(n.id).notes.push(copy);
      if(overview){const pos=positionOf(n);overviewPositions.set(copy.id,{x:pos.x+30,y:pos.y+30,manual:true});}
      return copy;
    });
    selected=new Set(copies.map(n=>n.id));closePanels();render();
  }
  function undo(){
    if(!history.length)return;
    if(editor)finishEditing(false);
    const past=JSON.parse(history.pop());data.pages=past.pages;pageId=past.pageId;overview=past.overview;overviewView=past.overviewView;overviewPositions=new Map(past.overviewPositions);study=past.study;serial=Math.max(serial,past.serial);selected.clear();closePanels();render();announce('마지막 변경을 취소했습니다.');
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.id==='mf-edit'){setMode(false);return;}
    if(b.id==='mf-study'){setMode(true);return;}
    if(b.dataset.page){
      if(editor)finishEditing(true);
      pageId=b.dataset.page;overview=false;selected.clear();closePanels();render();fit();return;
    }
    if(b.dataset.color){
      const n=byId(menuNote);if(!n)return;snapshot();n.color=b.dataset.color;
      const point=menuPoint;render();openMenu(n.id,point.x,point.y);return;
    }
    if(b.dataset.face&&e.detail===0){
      selected=new Set([b.dataset.face]);paintSelection();
      if(study)toggle(picked());
      return;
    }
    const id=menuNote||[...selected][0];
    switch(b.dataset.action){
      case'save-note':finishEditing(true);break;
      case'cancel-note':finishEditing(false);break;
      case'edit-note':startEditing(id);break;
      case'select-group':{
        const n=byId(id);if(n&&n.group){selected=new Set(visibleNotes().filter(item=>item.group===n.group&&ownerOf(item.id)===ownerOf(n.id)).map(item=>item.id));closePanels();paintSelection();}break;
      }
      case'all-pages':if(editor)finishEditing(true);overview=true;selected.clear();closePanels();render();fit();break;
      case'group':makeGroup();break;
      case'ungroup':ungroup();break;
      case'delete':remove();break;
      case'duplicate':duplicate();break;
      case'pages':showPages();break;
      case'close-pages':closePanels();break;
      case'export-file':exportFile();break;
      case'import-file':$('#mf-file-input').click();break;
    }
  });
  root.addEventListener('input',e=>{
    if(!editor)return;
    if(e.target.id==='mf-title-input')editor.title=e.target.value;
    if(e.target.id==='mf-body-input')editor.body=e.target.value;
  });
  root.addEventListener('change',async e=>{
    if(e.target.id==='mf-file-input'){await importFile(e.target.files?.[0]);return;}
    const n=byId(menuNote);if(!n||study)return;
    if(e.target.id==='mf-topic'||e.target.id==='mf-mask'){
      snapshot();n[e.target.id==='mf-topic'?'topic':'mask']=e.target.value;render();
    }
    if(e.target.id==='mf-owner'){
      const target=data.pages.find(p=>p.id===e.target.value),owner=ownerOf(n.id);
      if(target&&owner!==target){snapshot();owner.notes=owner.notes.filter(item=>item.id!==n.id);target.notes.push(n);n.group=null;selected.clear();closePanels();render();announce(target.name+' 페이지로 메모를 옮겼습니다.');}
    }
  });
  $('#mf-page-form').addEventListener('submit',e=>{
    e.preventDefault();const input=$('#mf-page-name'),name=input.value.trim();if(!name)return;
    snapshot();const id='page-'+Date.now()+'-'+serial++;
    data.pages.push({id,name,notes:[],view:{x:0,y:0,z:1}});pageId=id;overview=false;selected.clear();study=false;input.value='';closePanels();render();
    announce('새 페이지를 만들었습니다. 빈 공간을 우클릭해 메모를 추가하세요.');
  });
  canvas.addEventListener('contextmenu',e=>{
    if(e.target.closest('textarea'))return;
    e.preventDefault();
    const el=e.target.closest('[data-note]');
    if(study){closePanels();if(el){selected=new Set([el.dataset.note]);toggle([byId(el.dataset.note)]);}return;}
    if(el)openMenu(el.dataset.note,e.clientX,e.clientY);
    else addAt(e.clientX,e.clientY);
  });
  canvas.addEventListener('dblclick',e=>{
    if(study||e.target.closest('textarea')||e.target.closest('[data-action]'))return;
    const el=e.target.closest('[data-note]');
    if(el)startEditing(el.dataset.note);
  });
  canvas.addEventListener('pointerdown',e=>{
    if(e.target.closest('textarea')||e.target.closest('[data-action]'))return;
    if(e.button!==0&&e.button!==1)return;
    const el=e.target.closest('[data-note]');
    if(editor&&(!el||el.dataset.note!==editor.id)){finishEditing(true);if(el)return;}
    closePanels();
    if(!desktop()&&!el)return;
    if(space||e.button===1||!el){
      if(e.button===1)e.preventDefault();
      if(!space&&e.button!==1){selected.clear();paintSelection();}
      drag={type:'pan',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,x:view().x,y:view().y};
    }else{
      const n=byId(el.dataset.note);
      if(e.shiftKey){selected.has(n.id)?selected.delete(n.id):selected.add(n.id);}
      else if(!selected.has(n.id)){
        selected=new Set([n.id]);
      }
      paintSelection();
      if(study||e.shiftKey||!desktop())return;
      drag={type:'notes',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,items:picked().map(n=>({id:n.id,x:positionOf(n).x,y:positionOf(n).y})),moved:false};
    }
    if(drag.type==='pan')canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;
    if(drag.type==='pan'){view().x=drag.x+dx;view().y=drag.y+dy;applyView();return;}
    if(Math.abs(dx)+Math.abs(dy)<4&&!drag.moved)return;
    if(!drag.moved){snapshot();drag.moved=true;canvas.setPointerCapture(drag.pointer);}
    for(const origin of drag.items){
      const n=byId(origin.id),pos=positionOf(n);pos.x=origin.x+dx/view().z;pos.y=origin.y+dy/view().z;if(overview)pos.manual=true;
      const el=world.querySelector('[data-note="'+n.id+'"]');if(el){el.style.left=pos.x+'px';el.style.top=pos.y+'px';}
    }
  });
  function endDrag(){
    if(drag&&canvas.hasPointerCapture(drag.pointer))canvas.releasePointerCapture(drag.pointer);
    drag=null;
  }
  canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
  canvas.addEventListener('wheel',e=>{
    if(!desktop())return;
    if(editor)finishEditing(true);
    e.preventDefault();closePanels();
    const v=view();
    if(e.ctrlKey||e.metaKey){
      const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
      const z=Math.max(.55,Math.min(1.8,v.z+(e.deltaY<0?.07:-.07))),ratio=z/v.z;
      v.x=x-(x-v.x)*ratio;v.y=y-(y-v.y)*ratio;v.z=z;
    }else{v.x-=e.deltaX;v.y-=e.deltaY;}
    applyView();
  },{passive:false});
  document.addEventListener('pointerdown',e=>{
    if(!root.contains(e.target)){if(editor)finishEditing(true);closePanels();}
  });
  document.addEventListener('keydown',e=>{
    if(!root.isConnected||e.isComposing)return;
    const active=document.activeElement;
    const physicalKey=/^Key[A-Z]$/.test(e.code)?e.code.slice(3).toLowerCase():e.key.toLowerCase();
    if(!root.contains(active)&&active!==document.body)return;
    const textInput=active&&/INPUT|TEXTAREA|SELECT/.test(active.tagName);
    if(editor&&e.key==='Escape'){e.preventDefault();finishEditing(false);return;}
    if(editor&&(e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();finishEditing(true);return;}
    if((e.ctrlKey||e.metaKey)&&physicalKey==='s'){e.preventDefault();exportFile();return;}
    if((e.ctrlKey||e.metaKey)&&physicalKey==='o'){e.preventDefault();$('#mf-file-input').click();return;}
    if(textInput)return;
    const key=physicalKey,command=e.ctrlKey||e.metaKey;
    if(command){
      if(key==='z'){e.preventDefault();undo();}
      if(key==='g'&&!study){e.preventDefault();e.shiftKey?ungroup():makeGroup();}
      if(key==='d'&&!study){e.preventDefault();duplicate();}
      if(key==='a'){e.preventDefault();selected=new Set(visibleNotes().map(n=>n.id));paintSelection();}
      return;
    }
    if(e.altKey)return;
    if(key==='m'){e.preventDefault();setMode(!study);}
    if(key==='b'&&study){e.preventDefault();toggle(picked());}
    if(key==='p'){e.preventDefault();pagesPanel.hidden?showPages():closePanels();}
    if(key==='f'){e.preventDefault();fit();}
    if(key==='n'&&!study){e.preventDefault();const r=canvas.getBoundingClientRect();addAt(r.left+canvas.clientWidth/2,r.top+canvas.clientHeight/2);}
    if(key==='enter'&&!study&&selected.size===1){e.preventDefault();startEditing([...selected][0]);}
    if((key==='delete'||key==='backspace')&&!study&&menu.hidden&&pagesPanel.hidden){e.preventDefault();remove();}
    if(key==='escape'){closePanels();selected.clear();paintSelection();}
    if(e.code==='Space'&&desktop()){e.preventDefault();space=true;updateMode();}
  });
  document.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;updateMode();}});
  window.addEventListener('blur',()=>{space=false;endDrag();updateMode();});
  render();requestAnimationFrame(fit);
  let width=canvas.clientWidth,timer;
  if(window.ResizeObserver)new ResizeObserver(()=>{
    if(width===canvas.clientWidth)return;width=canvas.clientWidth;
    clearTimeout(timer);timer=setTimeout(()=>{closePanels();if(overview)render();fit();},100);
  }).observe(canvas);
})();
</script>

<style>
:root { color-scheme:light dark; }
html,body { margin:0; min-width:320px; min-height:100%; background:light-dark(#f7f6f2,#1c1f26); }
#moa-board { border-radius:0; min-height:100svh; }
#moa-board .mf-canvas { height:100svh; }
#moa-board .mf-modes { position:fixed; }
#moa-board .mf-pages { position:fixed; max-height:calc(100svh - 100px); overflow-y:auto; }
#moa-board .mf-menu { max-height:calc(100svh - 24px); overflow-y:auto; }
#moa-board .cursor-interaction { cursor:pointer; }
#moa-board .mf-note { cursor:grab; }
#moa-board .mf-note.mf-editing { cursor:default; }
@media(max-width:600px) {
  #moa-board .mf-canvas { height:auto; min-height:100svh; }
}
</style>
